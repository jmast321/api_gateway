services:
  hermes-gateway:
    build: .
    container_name: hermes-ai-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - DEFAULT_ROUTING_MODE=SYNERGY
      - MODEL_REFRESH_INTERVAL_MINUTES=30
      - MAX_RETRIES=3
      - BACKOFF_FACTOR=1.5
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
